name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 37 and build tools 37
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug and release, run lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease lintDebug

      - name: Print lint warnings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Ampere-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
